<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario Boda Bianca y Angel</title>
    
    <!-- Fuentes elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Paleta elegante crema y beige
                        boda: {
                            bg: '#FDFBF7',      
                            cream: '#F5F0E6',   
                            beige: '#E3D5CA',   
                            gold: '#C5A880',    
                            goldDark: '#A68A61',
                            text: '#4A4238',    
                            lightText: '#8A7E71'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FDFBF7;
            color: #4A4238;
            scroll-behavior: smooth;
        }
        
        /* Ocultar scrollbar para un look más limpio */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7; 
        }
        ::-webkit-scrollbar-thumb {
            background: #E3D5CA; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C5A880; 
        }

        /* Animación de pulso para el evento actual */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); } /* Amarillo de Tailwind */
            70% { box-shadow: 0 0 0 15px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }
        
        .active-dot {
            animation: softPulse 2s infinite;
        }

        .flower-ornament {
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-sans antialiased relative bg-boda-bg h-screen flex flex-col overflow-hidden">

    <!-- Ornamentos florales de fondo -->
    <div class="fixed top-0 left-0 w-64 h-64 -ml-16 -mt-16 flower-ornament z-0">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path fill="#C5A880" d="M45.7,-76.4C58.9,-69.3,69.1,-55.3,77.7,-41C86.3,-26.7,93.4,-11.9,91.8,2.1C90.2,16.1,79.9,29.3,69.5,40.4C59.1,51.5,48.5,60.5,35.8,67.6C23.1,74.7,8.2,79.9,-6.2,80.7C-20.6,81.5,-34.5,77.9,-46.8,70.5C-59.1,63.1,-69.8,51.8,-77.3,38.5C-84.8,25.2,-89.1,9.8,-86.3,-4.2C-83.5,-18.2,-73.6,-30.8,-62.7,-41.5C-51.8,-52.2,-39.9,-61,-26.8,-67.2C-13.7,-73.4,0.6,-77,15.7,-75.7C30.8,-74.4,45.7,-76.4,45.7,-76.4Z" transform="translate(100 100)" />
        </svg>
    </div>
    <div class="fixed bottom-0 right-0 w-80 h-80 -mr-20 -mb-20 flower-ornament z-0">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path fill="#C5A880" d="M51.9,-71.4C66.1,-60.7,75.9,-44.4,82.2,-27.1C88.5,-9.8,91.3,8.5,84.9,23.6C78.5,38.7,62.9,50.6,47.4,61.1C31.9,71.6,16,80.7,-0.5,81.4C-17,82.1,-34,74.4,-47.9,63.1C-61.8,51.8,-72.6,36.9,-78.9,20.3C-85.2,3.7,-87,-14.7,-80.6,-30.2C-74.2,-45.7,-59.6,-58.3,-44.1,-68.6C-28.6,-78.9,-14.3,-86.9,2.4,-90.1C19.1,-93.3,37.7,-82.1,51.9,-71.4Z" transform="translate(100 100)" />
        </svg>
    </div>

    <!-- Encabezado Fijo -->
    <header class="relative z-50 bg-white/85 backdrop-blur-md border-b border-boda-beige shadow-sm flex-shrink-0">
        <div class="max-w-5xl mx-auto px-4 py-3 sm:py-4 flex justify-between items-center">
            
            <!-- Izquierda: Reloj -->
            <div class="flex flex-col items-start w-1/4 sm:w-1/3">
                <span class="text-[9px] sm:text-[10px] text-boda-lightText uppercase tracking-widest mb-0.5">Hora Actual</span>
                <span id="real-time-clock" class="font-serif text-base sm:text-xl text-boda-goldDark font-semibold leading-none">--:--:--</span>
            </div>

            <!-- Centro: Título -->
            <div class="text-center w-2/4 sm:w-1/3 px-2">
                <p class="text-boda-goldDark uppercase tracking-[0.2em] text-[9px] sm:text-[10px] font-semibold mb-1">Itinerario Boda</p>
                <h1 class="font-serif text-2xl sm:text-3xl text-boda-text leading-tight whitespace-nowrap">Bianca <span class="text-boda-gold font-light">&amp;</span> Angel</h1>
            </div>

            <!-- Derecha: Mini Calendario -->
            <div class="flex justify-end w-1/4 sm:w-1/3" id="mini-calendar-container">
                <!-- El mini-calendario se inyecta por JS -->
            </div>
            
        </div>
    </header>

    <!-- Área de Scroll Independiente -->
    <div id="scrollable-content" class="flex-1 overflow-y-auto relative z-10 scroll-smooth pb-32">
        <main class="max-w-2xl mx-auto px-6 pt-10 relative">
            
            <!-- Línea base del timeline -->
            <div class="absolute left-[39px] md:left-[43px] top-4 bottom-4 w-[2px] bg-boda-beige/60"></div>
            
            <!-- Contenedor del Timeline donde se inyectarán los eventos y el cursor -->
            <div id="timeline-events" class="relative">
                <!-- Cursor de línea de tiempo dinámico -->
                <!-- Se ajusta la posición left para centrarlo en la línea según su ancho -->
                <img id="time-cursor" src="cursor-linea-de-tiempo.png" alt="Cursor actual" class="absolute z-30 w-8 h-8 transition-all duration-1000 transform -translate-y-1/2 left-[23px] md:left-[27px] drop-shadow-md hidden" />
                
                <!-- Los eventos se inyectarán aquí vía JS -->
            </div>
            
        </main>
    </div>

    <script>
        const currentYear = new Date().getFullYear();
        
        // Array de eventos actualizados según instrucciones
        const events = [
            { id: 0, dateStr: `${currentYear}-09-21T20:00:00`, title: "Despedida de Soltero", day: "21 Sep", icon: "🍻", responsable: "Bianca" },
            { id: 14, dateStr: `${currentYear}-09-22T11:00:00`, title: "Reparación de cámara", day: "22 Sep", icon: "📷", responsable: "Yoyo" },
            { id: 15, dateStr: `${currentYear}-09-22T17:00:00`, title: "Pegado de medallitas", day: "22 Sep", icon: "🏅", responsable: "Mimi" },
            { id: 2, dateStr: `${currentYear}-09-22T20:00:00`, title: "Despedida de soltera", day: "22 Sep", icon: "🥂", responsable: "Mimi" },
            { id: 3, dateStr: `${currentYear}-09-24T10:30:00`, title: "Llegada a la iglesia", day: "24 Sep", icon: "⛪", responsable: "Novios, invitados" },
            { id: 4, dateStr: `${currentYear}-09-24T11:00:00`, title: "Inicio de misa", day: "24 Sep", icon: "💍", responsable: "Padre Xavier" },
            { id: 5, dateStr: `${currentYear}-09-24T11:45:00`, title: "Fin de misa", day: "24 Sep", icon: "🕊️", responsable: "Fotógrafo" },
            { id: 6, dateStr: `${currentYear}-09-24T12:00:00`, title: "Llegada autobús", day: "24 Sep", icon: "🚌", responsable: "Yoyo/Transporte" },
            { id: 7, dateStr: `${currentYear}-09-24T12:30:00`, title: "Salida de autobus", day: "24 Sep", icon: "🛣️", responsable: "Yoyo/Mimi" },
            { id: 8, dateStr: `${currentYear}-09-24T13:00:00`, title: "Llegada a Restaurant", day: "24 Sep", icon: "🍽️", responsable: "Fotografo/Recepcion" },
            { id: 9, dateStr: `${currentYear}-09-24T13:15:00`, title: "Brindis", day: "24 Sep", icon: "🥂", responsable: "Novios" },
            { id: 10, dateStr: `${currentYear}-09-24T13:30:00`, title: "Inicio Comida", day: "24 Sep", icon: "🍴", responsable: "Restaurante" },
            { id: 11, dateStr: `${currentYear}-09-24T15:00:00`, title: "Primer Baile", day: "24 Sep", icon: "💃🕺", responsable: "Novios" },
            { id: 12, dateStr: `${currentYear}-09-24T18:00:00`, title: "Fin del evento", day: "24 Sep", icon: "✨", responsable: "Novios" },
            { id: 13, dateStr: `${currentYear}-09-25T08:00:00`, title: "Luna de miel", day: "25 Sep", icon: "✈️", responsable: "Novios" }
        ];

        // Convertimos las fechas a objetos Date reales
        events.forEach(ev => ev.time = new Date(ev.dateStr));

        // Obtenemos los elementos del DOM
        const timelineContainer = document.getElementById('timeline-events');
        const clockDisplay = document.getElementById('real-time-clock');
        const scrollableContent = document.getElementById('scrollable-content');
        
        let isFirstLoad = true;

        function formatTimeDiff(ms) {
            if (ms <= 0) return "00h 00m 00s";
            const days = Math.floor(ms / (1000 * 60 * 60 * 24));
            const hours = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((ms % (1000 * 60)) / 1000);
            
            let result = "";
            if (days > 0) result += `${days}d `;
            result += `${hours.toString().padStart(2, '0')}h `;
            result += `${minutes.toString().padStart(2, '0')}m `;
            result += `${seconds.toString().padStart(2, '0')}s`;
            return result;
        }

        function renderMiniCalendar() {
            const container = document.getElementById('mini-calendar-container');
            if (!container) return;
            
            const today = new Date();
            
            // Obtener el lunes de la semana actual
            const currentDayOfWeek = today.getDay() === 0 ? 7 : today.getDay(); // Lunes=1, Dom=7
            const monday = new Date(today);
            monday.setDate(today.getDate() - currentDayOfWeek + 1);

            const diasSemana = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
            let html = '<div class="flex gap-1 sm:gap-1.5">';

            for(let i = 0; i < 7; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);
                
                const isToday = dayDate.getDate() === today.getDate() && dayDate.getMonth() === today.getMonth();
                const bgClass = isToday ? 'bg-boda-gold text-white shadow-sm ring-1 ring-boda-goldDark' : 'bg-boda-cream text-boda-lightText';
                const hiddenClassMobile = (i < 5 && window.innerWidth < 640 && !isToday) ? 'hidden' : 'flex'; 

                html += `
                    <div class="${hiddenClassMobile} sm:flex flex-col items-center">
                        <span class="text-[8px] sm:text-[9px] uppercase font-semibold text-boda-lightText/80">${diasSemana[i]}</span>
                        <span class="${bgClass} w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center text-[9px] sm:text-[11px] font-bold mt-0.5 transition-colors">${dayDate.getDate()}</span>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function renderTimeline() {
            if (!timelineContainer) return;
            
            // Guardamos el cursor temporalmente antes de limpiar
            const cursorHtml = document.getElementById('time-cursor').outerHTML;
            timelineContainer.innerHTML = cursorHtml;
            
            let lastDay = '';

            events.forEach((ev) => {
                const timeStr = ev.time.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                let dayHtml = '';
                
                if (ev.day !== lastDay) {
                    dayHtml = `
                    <div class="relative z-20 mb-6 mt-8 flex items-center">
                        <div class="bg-white border border-boda-beige text-boda-goldDark text-xs font-bold px-3 py-1 rounded-full shadow-sm ml-[15px] md:ml-[19px]">
                            ${ev.day.toUpperCase()}
                        </div>
                    </div>`;
                    lastDay = ev.day;
                }

                const html = `
                    ${dayHtml}
                    <div id="event-container-${ev.id}" class="mb-8 relative flex items-start group w-full">
                        <div id="dot-${ev.id}" class="absolute left-[11px] md:left-[15px] top-6 w-4 h-4 rounded-full bg-white border-4 border-boda-cream z-10 transition-all duration-500 transform -translate-y-1/2 box-content"></div>
                        
                        <div class="ml-[50px] md:ml-[60px] w-full max-w-md">
                            <div id="card-${ev.id}" class="bg-white/90 p-4 rounded-2xl shadow-sm border border-transparent transition-all duration-500">
                                <div class="flex items-start gap-3 sm:gap-4">
                                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-boda-cream flex items-center justify-center text-xl sm:text-2xl flex-shrink-0">
                                        ${ev.icon}
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-serif text-lg sm:text-xl font-bold text-boda-text mb-1 leading-tight">${ev.title}</h3>
                                        <div class="flex flex-wrap gap-x-3 gap-y-1.5 text-xs sm:text-sm text-boda-lightText mb-2">
                                            <div class="flex items-center">
                                                <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 mr-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                ${timeStr} h
                                            </div>
                                            <div class="flex items-center">
                                                <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 mr-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                                <span class="bg-boda-bg px-2 py-0.5 rounded border border-boda-beige/50">${ev.responsable}</span>
                                            </div>
                                        </div>
                                        <div id="timer-${ev.id}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                timelineContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        function scrollToCurrentEvent() {
            if (!scrollableContent) return;
            const now = new Date();
            let targetId = events[0].id; // Por defecto el primero
            
            // Buscar cuál es el evento más relevante para enfocar
            for (let i = 0; i < events.length; i++) {
                if (now < events[i].time) {
                    // Si el evento aún no pasa, enfocamos el anterior (si existe) que podría estar "En curso"
                    targetId = i > 0 ? events[i-1].id : events[i].id;
                    break;
                }
                // Si ya pasamos todos, se quedará con el ID del último
                targetId = events[i].id;
            }

            const el = document.getElementById(`event-container-${targetId}`);
            if (el) {
                // Hacer scroll dentro del contenedor (con un margen superior para que no quede pegado)
                const offset = el.offsetTop - 60;
                scrollableContent.scrollTo({ top: offset, behavior: 'smooth' });
            }
        }

        function updateTimelineLogic() {
            const currentTime = new Date();

            if(clockDisplay) {
                clockDisplay.innerText = currentTime.toLocaleTimeString('es-ES', { 
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            }

            const oneHour = 60 * 60 * 1000;
            const twelveHours = 12 * 60 * 60 * 1000;
            
            let prevEventIndex = -1;

            events.forEach((ev, index) => {
                const dot = document.getElementById(`dot-${ev.id}`);
                const card = document.getElementById(`card-${ev.id}`);
                const timerEl = document.getElementById(`timer-${ev.id}`);
                
                if (!dot || !card) return;
                
                const nextEv = events[index + 1];
                let endTime;
                
                // Determinar cuándo "termina" el evento actual
                // Será cuando empiece el siguiente (si es pronto), o máximo 2 horas después de iniciar
                if (nextEv && (nextEv.time.getTime() - ev.time.getTime() < 4 * 60 * 60 * 1000)) {
                    endTime = nextEv.time;
                } else {
                    endTime = new Date(ev.time.getTime() + (2 * 60 * 60 * 1000));
                }
                
                const timeDiff = ev.time.getTime() - currentTime.getTime();

                /* LÓGICA ESTRICTA:
                   1. Si ya pasó el fin (endTime) -> TERMINADO (Verde)
                   2. Si faltan <= 1hr o estamos entre inicio y fin -> EN CURSO (Amarillo)
                   3. Si faltan entre 1hr y 12hr -> PRONTO (Naranja)
                   4. Si faltan > 12hr -> QUEDA TIEMPO (Crema)
                */

                if (currentTime >= endTime) {
                    // TERMINADO (Verde)
                    prevEventIndex = index; // Para el cursor
                    dot.className = "absolute left-[13px] md:left-[17px] top-6 w-3 h-3 rounded-full bg-green-500 z-10 transition-all duration-500 transform -translate-y-1/2 box-content shadow-sm";
                    card.className = "bg-white/60 p-3 sm:p-4 rounded-2xl shadow-sm border border-green-200 transition-all duration-500 opacity-70";
                    if (timerEl) {
                        timerEl.innerHTML = `<span class="text-green-700 font-sans font-bold flex items-center text-xs sm:text-sm"><span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-green-500 mr-1.5 sm:mr-2"></span> Terminado</span>`;
                        timerEl.className = "mt-2 sm:mt-3 bg-green-50 border border-green-200 text-green-700 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg inline-block transition-colors duration-300";
                    }
                } 
                else if ((timeDiff > 0 && timeDiff <= oneHour) || (currentTime >= ev.time && currentTime < endTime)) {
                    // EN CURSO (Amarillo)
                    if (currentTime >= ev.time) prevEventIndex = index;
                    
                    dot.className = "absolute left-[9px] md:left-[13px] top-6 w-5 h-5 rounded-full bg-yellow-400 border-4 border-white z-10 transition-all duration-500 transform -translate-y-1/2 box-content active-dot shadow-md";
                    card.className = "bg-white p-3 sm:p-4 rounded-2xl shadow-md border-2 border-yellow-400 transition-all duration-500 transform scale-[1.02] z-20 relative";
                    if (timerEl) {
                        let timeText = timeDiff > 0 ? `<span class="ml-1 font-mono">${formatTimeDiff(timeDiff)}</span>` : '<span class="ml-1 font-sans italic text-yellow-700">¡Sucediendo ahora!</span>';
                        timerEl.innerHTML = `<span class="text-yellow-700 font-sans font-bold flex items-center text-xs sm:text-sm"><span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-yellow-400 mr-1.5 sm:mr-2 animate-pulse"></span> ¡En curso! ${timeText}</span>`;
                        timerEl.className = "mt-2 sm:mt-3 bg-yellow-50 border border-yellow-300 text-yellow-800 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg inline-block shadow-sm transition-colors duration-300";
                    }
                } 
                else if (timeDiff > oneHour && timeDiff <= twelveHours) {
                    // PRONTO (Naranja)
                    dot.className = "absolute left-[11px] md:left-[15px] top-6 w-4 h-4 rounded-full bg-orange-400 border-4 border-white z-10 transition-all duration-500 transform -translate-y-1/2 box-content";
                    card.className = "bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-orange-300 transition-all duration-500";
                    if (timerEl) {
                        timerEl.innerHTML = `<span class="text-orange-600 font-sans text-[10px] sm:text-xs uppercase tracking-wider mr-1 font-bold">Pronto:</span> <span class="font-mono font-bold text-orange-700 text-xs sm:text-sm">${formatTimeDiff(timeDiff)}</span>`;
                        timerEl.className = "mt-2 sm:mt-3 bg-orange-50 border border-orange-200 text-orange-800 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg inline-block transition-colors duration-300";
                    }
                }
                else {
                    // QUEDA TIEMPO (Crema)
                    dot.className = "absolute left-[11px] md:left-[15px] top-6 w-4 h-4 rounded-full bg-white border-4 border-boda-cream z-10 transition-all duration-500 transform -translate-y-1/2 box-content";
                    card.className = "bg-white/80 p-3 sm:p-4 rounded-2xl shadow-sm border border-transparent transition-all duration-500";
                    if (timerEl) {
                        timerEl.innerHTML = `<span class="text-boda-lightText font-sans text-[10px] sm:text-xs uppercase tracking-wider mr-1">Faltan:</span> <span class="font-mono font-bold text-boda-goldDark text-xs sm:text-sm">${formatTimeDiff(timeDiff)}</span>`;
                        timerEl.className = "mt-2 sm:mt-3 bg-boda-bg border border-boda-beige/50 text-boda-text px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg inline-block transition-colors duration-300";
                    }
                }
            });

            // Actualizar la posición del cursor imagen
            updateCursorPosition(currentTime, prevEventIndex);
        }

        function updateCursorPosition(currentTime, prevIndex) {
            const cursor = document.getElementById('time-cursor');
            if (!cursor) return;
            
            cursor.classList.remove('hidden'); 
            
            let topPx = 0;
            
            if (prevIndex === -1) {
                // Si aún no empieza el primer evento
                const firstContainer = document.getElementById(`event-container-${events[0].id}`);
                if(firstContainer) topPx = firstContainer.offsetTop - 50; 
            } 
            else if (prevIndex >= events.length - 1) {
                // Si ya pasaron todos los eventos
                const lastContainer = document.getElementById(`event-container-${events[events.length-1].id}`);
                if(lastContainer) topPx = lastContainer.offsetTop + 50;
            } 
            else {
                // Si estamos entre dos eventos (interpolación de tiempo a píxeles)
                const evPrev = events[prevIndex];
                const evNext = events[prevIndex + 1];
                
                const containerPrev = document.getElementById(`event-container-${evPrev.id}`);
                const containerNext = document.getElementById(`event-container-${evNext.id}`);
                
                if (containerPrev && containerNext) {
                    // +24px es aproximadamente el centro vertical donde está dibujado el punto
                    const posPrev = containerPrev.offsetTop + 24; 
                    const posNext = containerNext.offsetTop + 24;
                    
                    const timeTotal = evNext.time.getTime() - evPrev.time.getTime();
                    const timePassed = currentTime.getTime() - evPrev.time.getTime();
                    
                    let progress = timePassed / timeTotal;
                    if (progress < 0) progress = 0;
                    if (progress > 1) progress = 1;
                    
                    topPx = posPrev + (progress * (posNext - posPrev));
                }
            }
            
            cursor.style.top = `${topPx}px`;
        }

        window.addEventListener('resize', renderMiniCalendar); 
        
        window.onload = () => {
            renderMiniCalendar();
            renderTimeline();
            updateTimelineLogic();
            
            // Retraso ligero para permitir que los estilos se apliquen antes del scroll
            setTimeout(() => {
                scrollToCurrentEvent();
            }, 300);
            
            setInterval(() => {
                updateTimelineLogic();
            }, 1000);
        };

    </script>
</body>
</html>
